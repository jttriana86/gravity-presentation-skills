<!--
Password Gate — Snippet opcional para propuestas confidenciales

USO:
1. Copia este <div id="passwordGate"> + el <script> al INICIO del <body> de tu deck.html
2. Cambia la variable PASSWORD por la del cliente
3. Cambia CLIENT_NAME por el nombre del cliente

ADVERTENCIA: esto es proteccion BASICA, no seguridad criptografica.
- Cualquiera con conocimientos de devtools puede ver el password en el codigo fuente.
- Sirve para evitar que una URL filtrada por error sea abierta por un random.
- Si necesitas seguridad real (NDA, info financiera sensible), usa Vercel Pro Password Protection.

============================================================
-->

<style>
  #passwordGate {
    position: fixed;
    inset: 0;
    background: #051367;
    z-index: 9999;
    display: grid;
    place-items: center;
    font-family: 'Open Sans', Arial, sans-serif;
  }
  #passwordGate.unlocked { display: none; }
  .gate-card {
    max-width: 420px;
    text-align: center;
    padding: 48px 40px;
  }
  .gate-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #E70039;
    margin-bottom: 32px;
    box-shadow: 0 0 0 4px rgba(231, 0, 57, 0.15);
  }
  .gate-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 32px;
    color: white;
    letter-spacing: -1px;
    margin-bottom: 12px;
    line-height: 1.1;
  }
  .gate-subtitle {
    font-family: 'Open Sans', sans-serif;
    font-style: italic;
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 32px;
  }
  #gateInput {
    width: 100%;
    padding: 14px 18px;
    font-family: 'Open Sans', sans-serif;
    font-size: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: white;
    outline: none;
    text-align: center;
    letter-spacing: 4px;
  }
  #gateInput:focus {
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
  }
  #gateInput::placeholder {
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }
  #gateBtn {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: white;
    color: #051367;
    border: none;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  #gateBtn:hover { transform: translateY(-2px); }
  #gateError {
    color: #E70039;
    font-size: 13px;
    margin-top: 16px;
    min-height: 18px;
    font-weight: 700;
  }
  .gate-foot {
    margin-top: 32px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
</style>

<div id="passwordGate">
  <div class="gate-card">
    <span class="gate-dot"></span>
    <h1 class="gate-title">Propuesta confidencial</h1>
    <p class="gate-subtitle">Para <strong>CLIENT_NAME</strong>. Ingrese la clave de acceso.</p>

    <input type="password" id="gateInput" placeholder="••••••••" autocomplete="off" autofocus>
    <button id="gateBtn" type="button">Acceder</button>

    <p id="gateError"></p>

    <div class="gate-foot">PRESENTADO POR GRAVITY</div>
  </div>
</div>

<script>
  (function() {
    const PASSWORD = "CAMBIAR_ESTE_PASSWORD";
    const STORAGE_KEY = "gravity-gate-" + location.pathname;

    const gate = document.getElementById('passwordGate');
    const input = document.getElementById('gateInput');
    const btn = document.getElementById('gateBtn');
    const err = document.getElementById('gateError');

    // Si ya autenticado en esta sesion, saltar
    if (sessionStorage.getItem(STORAGE_KEY) === 'ok') {
      gate.classList.add('unlocked');
      return;
    }

    function tryUnlock() {
      if (input.value === PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, 'ok');
        gate.style.transition = 'opacity 400ms';
        gate.style.opacity = '0';
        setTimeout(() => gate.classList.add('unlocked'), 400);
      } else {
        err.textContent = 'Clave incorrecta. Intenta de nuevo.';
        input.value = '';
        input.focus();
        // Shake animation
        input.style.transition = 'transform 0.1s';
        input.style.transform = 'translateX(-8px)';
        setTimeout(() => input.style.transform = 'translateX(8px)', 100);
        setTimeout(() => input.style.transform = 'translateX(0)', 200);
      }
    }

    btn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryUnlock();
    });
  })();
</script>
